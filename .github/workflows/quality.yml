name: Website quality

on:
  push:
    branches: [main, build/site-v1]
  pull_request:
    branches: [main]

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
        env:
          NEXT_PUBLIC_SITE_LIVE: "false"
          NEXT_PUBLIC_SITE_URL: "https://kommunalroutine.example"
