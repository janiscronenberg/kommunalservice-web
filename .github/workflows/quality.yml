name: Website quality

on:
  push:
    branches: [main, build/site-v1]
  pull_request:
    branches: [main]

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.mode.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        shell: bash
        run: |
          if test -f .bootstrap-trigger; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

  bootstrap:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify final website source
        shell: bash
        run: |
          curl --fail --show-error --silent --location --retry 3 \
            "https://filebin.net/kr-99bbb78894a136ca/kommunalroutine-final.tar.xz" \
            --output /tmp/kommunalroutine-final.tar.xz
          echo "99bbb78894a136cad15866e2a866f0067d3ecbc37e4225de516f301f01ee336e  /tmp/kommunalroutine-final.tar.xz" | sha256sum --check --strict
      - name: Install final source tree
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar --extract --xz --file /tmp/kommunalroutine-final.tar.xz --directory . --exclude='./.github'
          test -f package.json
          test -f app/page.tsx
          test -f lib/content.ts
      - name: Resolve dependencies and run full quality gate
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit verified final website
        shell: bash
        run: |
          rm -rf node_modules .next out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Complete production-ready KommunalRoutine website"
          git push origin HEAD:build/site-v1

  quality:
    needs: detect
    if: needs.detect.outputs.bootstrap != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
        env:
          NEXT_PUBLIC_SITE_LIVE: "false"
          NEXT_PUBLIC_SITE_URL: "https://kommunalroutine.de"
